# python main.py stage=train_strong_po dataset=hh_rlhf model=opt method=ms_po loss=dpo
defaults:
  - paths: default
  - dataset: hh_rlhf
  - model: opt
  - method: ms_po
  - loss: dpo
  - train@train.weak_sft: weak_sft
  - train@train.weak_po: weak_po
  - train@train.strong_sft: strong_sft
  - train@train.strong_po: strong_po
  - eval: default
  - logger: wandb
  - hub: default
  - _self_

stage: ???   # preflight | prepare_data | train_weak | annotate | train_strong_sft | compute_ms_weights | train_strong_po | evaluate | collect_results
seed: 42
precision: fp16          # mixed precision: fp16 | bf16 | fp32 (reference code: fp16)
model_dtype: fp32        # load dtype: fp32 | bf16 | fp16 (reference code: fp32)
infer_batch_size: 4      # per-GPU batch for annotation / MS weights
overwrite: false         # true: recompute finished stages
debug_max_samples: null  # smoke tests only: truncate every split

ms:
  gamma: 1.0             # Eq. 10
  variant: direct        # direct (Eq. 11) | weak (25) | marginal (26) | bounded (27) | normalized (28)

hydra:
  run:
    dir: ${paths.root_dir}/outputs/hydra/${stage}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
