# Anthropic HH-RLHF, Helpful
name: hh_helpful
loader: hh_rlhf
hf_path: Anthropic/hh-rlhf
subsets: [helpful-base]
train_split: train
test_split: test
max_length: 512              # length filter (GPT-2 tokens) and training max_length
length_tokenizer: openai-community/gpt2
unlabeled_fraction: 0.7      # 30% labeled / 70% unlabeled
validation_fraction: 0.01    # of the 70%, for eval_loss
reward_model: skywork        # skywork | deberta
