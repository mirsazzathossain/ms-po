# TL;DR (Stiennon et al., 2020)
name: tldr
loader: tldr
hf_path: openai/summarize_from_feedback
hf_name: comparisons
train_split: train
test_split: validation
max_length: 1024             # length filter (words) and training max_length
length_tokenizer: openai-community/gpt2
unlabeled_fraction: 0.7
validation_fraction: 0.01
reward_model: deberta
eval_num_samples: 2000       # NOT GIVEN in paper: GRA on a fixed-seed subset of the ~86k test comparisons
