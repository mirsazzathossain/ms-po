services:
  ms-po:
    build: .
    image: ms-po:latest
    env_file: .env
    environment:
      - NUM_GPUS=${NUM_GPUS:-}
    volumes:
      - ./data:/workspace/ms-po/data
      - ./checkpoints:/workspace/ms-po/checkpoints
      - ./outputs:/workspace/ms-po/outputs
      - ${HF_CACHE:-~/.cache/huggingface}:/workspace/.cache/huggingface
    shm_size: 32gb
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
